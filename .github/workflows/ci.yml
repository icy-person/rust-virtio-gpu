name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      LIBGL_ALWAYS_SOFTWARE: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Install Venus backend system dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y libvirglrenderer-dev libvulkan-dev libegl1 mesa-vulkan-drivers pkg-config clang
          ICD=$(find /usr/share/vulkan/icd.d -maxdepth 1 -type f -name '*lvp*.json' -print -quit)
          test -n "$ICD"
          echo "VK_DRIVER_FILES=$ICD" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Patch virglrenderer wrapper for Ubuntu 24.04 headers
        shell: bash
        run: |
          set -euo pipefail
          cargo fetch
          SRC=$(find "$HOME/.cargo/registry/src" -path '*/virglrenderer-0.1.3/src/lib.rs' -print -quit)
          test -n "$SRC"
          python3 - "$SRC" <<'PY'
          from pathlib import Path
          import sys
          p = Path(sys.argv[1])
          s = p.read_text()
          old = '        ffi::virgl_log_level_flags_VIRGL_LOG_LEVEL_SILENT => Level::Error, // Or another appropriate level\n'
          new = '        4 => return, // VIRGL_LOG_LEVEL_SILENT is absent from Ubuntu 24.04 headers\n'
          if old not in s:
              raise SystemExit(f'expected virglrenderer compatibility line not found in {p}')
          p.write_text(s.replace(old, new, 1))
          PY
          grep -q '4 => return' "$SRC"
      - name: Verify Vulkan software device
        shell: bash
        run: |
          set -euo pipefail
          echo "Using Vulkan ICD: $VK_DRIVER_FILES"
          if command -v vulkaninfo >/dev/null 2>&1; then
            vulkaninfo --summary 2>/dev/null | grep -E 'GPU|deviceName' | head -n 5 || true
          fi
      - name: Validate Waydroid helper script
        shell: bash
        run: bash -n tools/waydroid-venus-enable.sh
      - name: Build
        run: cargo check --all-targets --all-features
      - name: Build Waydroid Venus launcher
        run: cargo build --release --bin waydroid-venus --all-features
      - name: Test
        run: cargo test --all-targets --all-features
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
