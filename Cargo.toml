[package]
name = "rust-virtio-gpu"
version = "0.1.0"
edition = "2024"

[features]
default = []
virglrenderer-backend = ["dep:virglrenderer", "dep:virglrenderer-sys"]

[dependencies]
bitflags = "2.9"
minifb = "0.27"
winit = "0.30"
pollster = "0.4"
bytemuck = { version = "1.20", features = ["derive"] }
ash = "0.38"
# 0.1.4+ currently assumes newer virglrenderer headers than Ubuntu 24.04
# ships. Keep the 0.1.3 safe wrapper and use its matching generated FFI crate
# directly for the context/ring 64-bit fence operation.
virglrenderer = { version = "=0.1.3", optional = true }
virglrenderer-sys = { version = "=0.1.4", optional = true }
