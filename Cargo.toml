[package]
name = "rust-virtio-gpu"
version = "0.1.0"
edition = "2024"

[features]
default = []
virglrenderer-backend = ["dep:virglrenderer"]

[dependencies]
bitflags = "2.9"
minifb = "0.27"
winit = "0.30"
pollster = "0.4"
bytemuck = { version = "1.20", features = ["derive"] }
ash = "0.38"
virglrenderer = { version = "0.1.5", optional = true }
