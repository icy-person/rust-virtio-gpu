[package]
name = "rust-virtio-gpu"
version = "0.1.0"
edition = "2024"

[features]
default = []
virglrenderer-backend = ["dep:virglrenderer"]

[dependencies]
bitflags = "2.9"
minifb = "0.27"
winit = "0.30"
pollster = "0.4"
bytemuck = { version = "1.20", features = ["derive"] }
ash = "0.38"
# 0.1.4+ currently assumes newer virglrenderer headers than Ubuntu 24.04
# ships.  Keep the older wrapper while the backend FFI is made header-aware.
virglrenderer = { version = "=0.1.3", optional = true }
